model:
  n_layer: 4
  n_head: 4
  n_embd: 128
  block_size: 256
  vocab_size: 1024
  dropout: 0.1
  bias: true

train:
  batch_size: 16
  max_steps: 5000
  learning_rate: 3.0e-4
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.99
  warmup_steps: 100
  grad_clip: 1.0
  eval_interval: 250
  eval_batches: 20
  sample_interval: 500
  checkpoint_interval: 1000
  seed: 1337

data:
  dataset: shakespeare
  data_dir: data/smoke          # or data/tinystories later
  train_frac: 0.9

paths:
  out_dir: checkpoints/toy_cpu
  tokenizer_path: data/smoke/tokenizer.json  # vocab 1024 BPE